name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_release.py dist/QatYar-Windows.zip
      - name: Publish release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
               gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" dist/QatYar-Windows.zip --clobber; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
