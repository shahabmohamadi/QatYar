name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_release.py dist/QatYar-Windows.zip
      - name: Publish release with changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/QatYar-Windows.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
